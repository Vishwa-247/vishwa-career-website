<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo Account Page</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
/* Define CSS styles for .container3 */
.container3 {
    position: absolute;
    top: 70%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%; /* Adjusted width for responsiveness */
    max-width: 1200px; /* Set a maximum width */
    margin: 0 auto; /* Centers the content */
    backdrop-filter: blur(25px);
    border: 2px solid var(--primary-color);
    border-radius: 5px;
    padding: 3.5em 3.5em 4em 3.6em; /* Adjust padding */
    color: var(--second-color);
    box-shadow: 0px 0px 10px 2px rgba(0, 0, 0, 0.2);
    font-family: 'Poppins', sans-serif;
    line-height: 2.5;
    display: flex; /* Use flexbox to control layout */
    flex-direction: column; /* Arrange items vertically */
    overflow-y: auto; /* Enable vertical scrolling */
    height: 100vh; /* Set a fixed height for the container */
}


/* Media query for smaller screens */
@media screen and (max-width: 768px) {
  .container3 {
    padding: 2em; /* Adjusted padding for smaller screens */
  }
}

/* Style for the "Add New" button */
.bi-file-earmark-plus + a {
  display: inline-block; /* Make it sit nicely beside the icon */
  padding: 8px 16px;     /* Button padding */
  background-color: #0d6efd;  /* Bootstrap primary blue */
  color: white;
  border: none;          /* Remove default border */
  border-radius: 4px;    /* Slightly rounded corners */
  text-decoration: none; /* No underline */
}

.bi-file-earmark-plus + a:hover {
  background-color: #0b5ed7; /* Slightly darker on hover */
}

/* Style for the resume containers */
.border { 
  border: 1px solid #ddd; /* Adjust border color and thickness */
  padding: 15px;      /* Add padding within the container */
  margin-bottom: 15px; /* Add spacing between resume items */
}

/* Style for resume titles */
h5 {
  font-weight: bold; 
  margin-bottom: 5px; 
}

/* Style for the links within each resume container */
.d-flex.gap-2 a {
  color: #007bff; /* Default Bootstrap link color */
  text-decoration: none;
}
.d-flex.gap-2 a:hover {
  text-decoration: underline;
}

/* Style for the back button */
.back-button-acc {
  margin-top: -40px; 
  margin-left: 930px;
}

.back-button-acc button {
  padding: 10px 20px; /* Adjust padding as needed */
  background-color: #007bff; /* Bootstrap primary blue */
  color: white;
  font-size: 16px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.back-button-acc button:hover {
  background-color: #0056b3; /* Darker blue on hover */
}

/* Media query for smaller screens */
@media screen and (max-width: 768px) {
    .back-button-acc {
        margin-top: -35px; /* Adjust top margin for smaller screens */
        margin-left: 300px; /* Align to the left */
        margin-right: 30px; /* Add some space from the right */
        text-align: left; /* Align the button to the left */
    }

    .back-button-acc button {
        padding: 6px 12px; /* Adjust padding for smaller screens */
        font-size: 16px; /* Adjust font size for smaller screens */
    }
}


</style>
</head>
<body>
<nav class="navbar bg-white">
    <div class="container">
        <div class="navbar-content">
            <div class="brand-and-toggler">
                <a href="index.html" class="navbar-brand">
                    <img src="assets/images/curriculum-vitae.png" alt="" class="navbar-brand-icon">
                    <span class="navbar-brand-text">Quick <span>resume.</span></span>
                </a>

                <!-- Demo mode indicator -->
                <div class="account-button">
                    <span class="navbar-link font-poppins">
                        <i class="bi bi-play-circle"></i> Demo Mode
                    </span>
                </div>

                <!-- Back to home button -->
                <div class="back-button-new">
                    <button onclick="goHome()" class="font-poppins"><i class="bi bi-house"></i> Home</button>
                </div>
            </div>
            </div>
    </div>
</nav>
<div class="container3">
    <div class="bg-white rounded shadow p-2 mt-4" style="min-height:80vh">
        <div class="d-flex justify-content-between border-bottom align-items-center">
            <h3 class="m-0">My Resumes (Demo)</h3> 
            
            <div class="back-button-acc">
                  <button onclick="goBack()">Back</button>
              </div>

            <!-- Add New button positioned to the right -->
            <div class="add-new-button">
                <a href="demo-resume.html" class="text-decoration-none"><i class="bi bi-file-earmark-plus"></i> Add New</a>
            </div>
        </div>
        <div id="resumes-container">
            <!-- Resumes will be loaded here from localStorage -->
        </div>
    </div>
</div>
<script>
    function goHome() {
        window.location.href = "index.html";
    }
    function goBack() {
        window.history.back();
    }

    // Load resumes from localStorage
    function loadResumes() {
        const resumesContainer = document.getElementById('resumes-container');
        const resumes = JSON.parse(localStorage.getItem('demoResumes') || '[]');
        
        if (resumes.length === 0) {
            resumesContainer.innerHTML = `
                <div class="text-center py-3 border rounded mt-3" style="background-color: rgba(236, 236, 236, 0.56);">
                    <i class="bi bi-file-text"></i> No Resumes Available
                </div>
            `;
        } else {
            let html = '<div class="d-flex flex-wrap">';
            resumes.forEach((resume, index) => {
                const lastUpdated = resume.lastUpdated ? new Date(resume.lastUpdated).toLocaleDateString() : 'N/A';
                html += `
                    <div class="col-12 col-md-6 p-2">
                        <div class="p-2 border rounded">
                            <h3>${resume.resume_title || 'Untitled Resume'}</h3>
                            <p style="font-size: 12px;"><i class="bi bi-clock-history"></i> Last updated on ${lastUpdated}</p>
                        </div>
                        <div class="d-flex gap-2 mt-1">
                            <a href="demo-view-resume.html?id=${index}" class="text-decoration-none small"><i class="bi bi-file-text"></i> Open</a>
                            <a href="demo-resume.html?id=${index}" class="text-decoration-none small"><i class="bi bi-pencil-square"></i> Edit</a>
                            <a href="#" onclick="deleteResume(${index}); return false;" class="text-decoration-none small"><i class="bi bi-trash2"></i> Delete</a>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            resumesContainer.innerHTML = html;
        }
    }

    function deleteResume(index) {
        if (confirm('Are you sure you want to delete this resume?')) {
            const resumes = JSON.parse(localStorage.getItem('demoResumes') || '[]');
            resumes.splice(index, 1);
            localStorage.setItem('demoResumes', JSON.stringify(resumes));
            loadResumes();
        }
    }

    // Load resumes on page load
    loadResumes();
</script>
</body>
</html>
