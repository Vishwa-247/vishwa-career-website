<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Create Resume - Demo</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- custom css -->
        <link rel="stylesheet" href="assets/css/main.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    </head>
    <body>
        <nav class = "navbar bg-white">
            <div class="container">
                <div class = "navbar-content">
                    <div class = "brand-and-toggler">
                        <a href="index.html" class="navbar-brand">
                            <img src = "assets/images/curriculum-vitae.png" alt = "" class = "navbar-brand-icon">
                            <span class = "navbar-brand-text">Quick <span>resume.</span>
                        </a>

                        <div class="back-button">
                            <button onclick="goBack()">Back</button>
                        </div>                        
                    </div>
                </div>
            </div>
        </nav>
        <style>
                .btn.btn-primary {
           
            background-color: #007bff; 
            color: #fff; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: transform 0.3s ease; 
            margin-left: 1010px;
        }
        
        .btn.btn-primary:hover {
            background-color: var(--clr-blue-dark); 
        }
        
        .bi {
           
            font-size: 1.5rem; 
            margin-right: 5px; 
        }
    </style>


        <script>

            function saveResume(event) {
                event.preventDefault();
                
                // Get form data
                const formData = {
                    resume_title: document.querySelector('[name="resume_title"]').value,
                    firstname: document.querySelector('[name="firstname"]').value,
                    middlename: document.querySelector('[name="middlename"]').value,
                    lastname: document.querySelector('[name="lastname"]').value,
                    designation: document.querySelector('[name="designation"]').value,
                    address: document.querySelector('[name="address"]').value,
                    email: document.querySelector('[name="email"]').value,
                    phoneno: document.querySelector('[name="phoneno"]').value,
                    summary: document.querySelector('[name="summary"]').value,
                    lastUpdated: new Date().toISOString()
                };
                
                // Get existing resumes from localStorage
                let resumes = JSON.parse(localStorage.getItem('demoResumes') || '[]');
                
                // Check if we're editing an existing resume
                const urlParams = new URLSearchParams(window.location.search);
                const resumeId = urlParams.get('id');
                
                if (resumeId !== null) {
                    // Update existing resume
                    resumes[parseInt(resumeId)] = formData;
                } else {
                    // Add new resume
                    resumes.push(formData);
                }
                
                // Save back to localStorage
                localStorage.setItem('demoResumes', JSON.stringify(resumes));
                
                alert('Resume saved successfully!');
                window.location.href = 'demo-account.html';
                
                return false;
            }
            
            function goBack() {
                window.history.back();
            }
            
            // Load resume data if editing
            window.onload = function() {
                const urlParams = new URLSearchParams(window.location.search);
                const resumeId = urlParams.get('id');
                
                if (resumeId !== null && !isNaN(resumeId)) {
                    const resumes = JSON.parse(localStorage.getItem('demoResumes') || '[]');
                    const resume = resumes[parseInt(resumeId)];
                    
                    if (resume) {
                        document.querySelector('[name="resume_title"]').value = resume.resume_title || '';
                        document.querySelector('[name="firstname"]').value = resume.firstname || '';
                        document.querySelector('[name="middlename"]').value = resume.middlename || '';
                        document.querySelector('[name="lastname"]').value = resume.lastname || '';
                        document.querySelector('[name="designation"]').value = resume.designation || '';
                        document.querySelector('[name="address"]').value = resume.address || '';
                        document.querySelector('[name="email"]').value = resume.email || '';
                        document.querySelector('[name="phoneno"]').value = resume.phoneno || '';
                        document.querySelector('[name="summary"]').value = resume.summary || '';
                    }
                }
            };

          </script>

        <section id = "about-sc" class = "">
            <div class = "container">
                <div class = "about-cnt">
                    <form onsubmit="return saveResume(event)" class="cv-form" id="cv-form">
                        <div class = "cv-form-blk">
                            <div class = "cv-form-row-title">
                                <h3>about section</h3>
                            </div>
                            <div class = "cv-form-row cv-form-row-about">
                                <div class = "form-elem">
                                    <label for = "" class = "form-label">Resume Title</label>
                                    <input name = "resume_title" type = "text" class = "form-control firstname" id = "" placeholder="e.g. Web developer Consultant " required>
                                    <span class="form-text"></span>
                                </div>
                                <div class = "cols-3">
                                    
                                    <div class = "form-elem">
                                        <label for = "" class = "form-label">First Name</label>
                                        <input name = "firstname" type = "text" class = "form-control firstname" id = "" placeholder="e.g. Vishwa" required>
                                        <span class="form-text"></span>
                                    </div>
                                    <div class = "form-elem">
                                        <label for = "" class = "form-label">Middle Name <span class = "opt-text">(optional)</span></label>
                                        <input name = "middlename" type = "text" class = "form-control middlename" id = "" placeholder="e.g. Teja">
                                        <span class="form-text"></span>
                                    </div>
                                    <div class = "form-elem">
                                        <label for = "" class = "form-label">Last Name</label>
                                        <input name = "lastname" type = "text" class = "form-control lastname" id = "" placeholder="e.g. Thouti" required>
                                        <span class="form-text"></span>
                                    </div>
                                </div>

                                <div class="cols-3">
                                    
                                    <div class = "form-elem">
                                        <label for = "" class = "form-label">Designation</label>
                                        <input name = "designation" type = "text" class = "form-control designation" id = "" placeholder="e.g. B.Tech">
                                        <span class="form-text"></span>
                                    </div>
                                    <div class = "form-elem">
                                        <label for = "" class = "form-label">Address</label>
                                        <input name = "address" type = "text" class = "form-control address" id = "" placeholder="e.g. Warangal">
                                        <span class="form-text"></span>
                                    </div>
                                </div>

                                <div class = "cols-3">
                                    <div class = "form-elem">
                                        <label for = "" class = "form-label">Email</label>
                                        <input name = "email" type = "email" class = "form-control email" id = "" placeholder="e.g. Vishwa@gmail.com">
                                        <span class="form-text"></span>
                                    </div>
                                    <div class = "form-elem">
                                        <label for = "" class = "form-label">Phone No:</label>
                                        <input name = "phoneno" type = "text" class = "form-control phoneno" id = "" placeholder="e.g. 8309680569">
                                        <span class="form-text"></span>
                                    </div>
                                    <div class = "form-elem">
                                        <label for = "" class = "form-label">Summary</label>
                                        <input name = "summary" type = "text" class = "form-control summary" id = "" placeholder="e.g. Your self ">
                                        <span class="form-text"></span>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <div>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Save Resume</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </body>
</html>
